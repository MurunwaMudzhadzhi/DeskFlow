# Local orchestration: MongoDB + API + React (nginx).
#   docker compose up -d             -> http://localhost:8080
#   docker compose run --rm seed     -> (re)create demo users (idempotent; also runs on up)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/deskflow
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
      JWT_EXPIRES_IN: 8h
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  seed:
    build: ./backend
    command: ["node", "src/utils/seed.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/deskflow
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
